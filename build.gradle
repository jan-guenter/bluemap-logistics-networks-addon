// SPDX-License-Identifier: MIT

plugins {
    id 'java-library'
    id 'checkstyle'
    id 'maven-publish'
}

group = addon_group
version = addon_version

base {
    archivesName = artifact_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven {
        url = uri('https://repo.bluecolored.de/releases')
        content { includeGroupByRegex('de\\.bluecolored.*') }
    }
}

dependencies {
    compileOnly "de.bluecolored:bluemap-core:${bluemap_version}"
    compileOnly 'org.jetbrains:annotations:23.0.0'

    testImplementation "de.bluecolored:bluemap-core:${bluemap_version}"
    testImplementation 'org.jetbrains:annotations:23.0.0'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    def logisticsNetworksJar = providers.gradleProperty('logisticsNetworksJar')
    if (logisticsNetworksJar.isPresent()) {
        systemProperty 'logisticsNetworksJar', logisticsNetworksJar.get()
    }
}

checkstyle {
    toolVersion = '10.18.2'
    configFile = file('config/checkstyle/checkstyle.xml')
}

tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(
                'Automatic-Module-Name': 'io.github.janguenter.bluemap.logisticsnetworks',
                'Implementation-Title': addon_name,
                'Implementation-Version': project.version.toString()
        )
    }
    from('LICENSE') {
        into 'META-INF'
        rename { 'LICENSE-bluemap-logistics-networks-addon' }
    }
    from('NOTICE.md') {
        into 'META-INF'
        rename { 'NOTICE-bluemap-logistics-networks-addon.md' }
    }
    from('THIRD_PARTY.md') {
        into 'META-INF'
        rename { 'THIRD_PARTY-bluemap-logistics-networks-addon.md' }
    }
    from('provenance/upstreams.json') {
        into 'META-INF/bluemap-logistics-networks'
    }
}

tasks.named('sourcesJar', Jar).configure {
    from('LICENSE') {
        into 'META-INF'
        rename { 'LICENSE-bluemap-logistics-networks-addon' }
    }
    from('NOTICE.md') {
        into 'META-INF'
        rename { 'NOTICE-bluemap-logistics-networks-addon.md' }
    }
    from('THIRD_PARTY.md') {
        into 'META-INF'
        rename { 'THIRD_PARTY-bluemap-logistics-networks-addon.md' }
    }
    from('provenance/upstreams.json') {
        into 'META-INF/bluemap-logistics-networks'
    }
}

def productionJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
def publishedSourcesJar = tasks.named('sourcesJar', Jar).flatMap { it.archiveFile }

tasks.register('verifyProductionJar') {
    dependsOn tasks.named('jar')
    inputs.file(productionJar)

    doLast {
        def jarFile = inputs.files.singleFile
        def zip = new java.util.zip.ZipFile(jarFile)
        try {
            def entries = zip.entries().findAll { !it.directory }.collect { it.name }
            def required = [
                    'bluemap.addon.json',
                    'bluemap-logistics-networks/profiles/logisticsnetworks/1.10.1/profile.json',
                    'io/github/janguenter/bluemap/logisticsnetworks/adapter/bluemap522/SyntheticSheetTexture.class',
                    'META-INF/LICENSE-bluemap-logistics-networks-addon',
                    'META-INF/NOTICE-bluemap-logistics-networks-addon.md',
                    'META-INF/THIRD_PARTY-bluemap-logistics-networks-addon.md',
                    'META-INF/bluemap-logistics-networks/upstreams.json'
            ]
            def missing = required.findAll { !entries.contains(it) }
            if (!missing.isEmpty()) {
                throw new GradleException("Production JAR is missing: ${missing}")
            }

            def addon = new groovy.json.JsonSlurper().parseText(
                    zip.getInputStream(zip.getEntry('bluemap.addon.json')).getText('UTF-8')
            )
            if (addon.id != addon_id
                    || addon.entrypoint
                    != 'io.github.janguenter.bluemap.logisticsnetworks.BlueMapLogisticsNetworksAddon'
                    || addon.dependencies != []
                    || addon['soft-dependencies'] != []) {
                throw new GradleException('BlueMap add-on metadata mismatch')
            }

            def forbidden = entries.findAll {
                it.endsWith('.jar')
                        || it.endsWith('.png')
                        || it == 'META-INF/neoforge.mods.toml'
                        || it == 'fabric.mod.json'
                        || it.endsWith('.mixins.json')
                        || it.startsWith('assets/logisticsnetworks/')
                        || it.startsWith('me/almana/')
                        || it.startsWith('de/bluecolored/')
                        || it.startsWith('net/minecraft/')
                        || it.startsWith('net/neoforged/')
                        || it.startsWith('gallery/')
            }
            if (!forbidden.isEmpty()) {
                throw new GradleException("Production JAR contains forbidden entries: ${forbidden}")
            }
        } finally {
            zip.close()
        }
    }
}

tasks.register('verifySourcesJar') {
    dependsOn tasks.named('sourcesJar')
    inputs.file(publishedSourcesJar)

    doLast {
        def jarFile = inputs.files.singleFile
        def zip = new java.util.zip.ZipFile(jarFile)
        try {
            def entries = zip.entries().findAll { !it.directory }.collect { it.name }
            def required = [
                    'io/github/janguenter/bluemap/logisticsnetworks/BlueMapLogisticsNetworksAddon.java',
                    'io/github/janguenter/bluemap/logisticsnetworks/adapter/bluemap522/LogisticsNodeRenderPass.java',
                    'io/github/janguenter/bluemap/logisticsnetworks/adapter/bluemap522/SyntheticSheetTexture.java',
                    'bluemap.addon.json',
                    'bluemap-logistics-networks/profiles/logisticsnetworks/1.10.1/profile.json',
                    'META-INF/LICENSE-bluemap-logistics-networks-addon',
                    'META-INF/NOTICE-bluemap-logistics-networks-addon.md',
                    'META-INF/THIRD_PARTY-bluemap-logistics-networks-addon.md',
                    'META-INF/bluemap-logistics-networks/upstreams.json'
            ]
            def missing = required.findAll { !entries.contains(it) }
            if (!missing.isEmpty()) {
                throw new GradleException("Sources JAR is missing: ${missing}")
            }
            def projectJava = entries.findAll { it.endsWith('.java') }
            def foreignJava = projectJava.findAll {
                !it.startsWith('io/github/janguenter/bluemap/logisticsnetworks/')
            }
            def forbidden = entries.findAll {
                it.endsWith('.class')
                        || it.endsWith('.jar')
                        || it.endsWith('.png')
                        || it.startsWith('assets/logisticsnetworks/')
                        || it.startsWith('me/almana/')
                        || it.startsWith('de/bluecolored/')
                        || it.startsWith('net/minecraft/')
                        || it.startsWith('net/neoforged/')
                        || it.startsWith('gallery/')
            }
            if (projectJava.isEmpty() || !foreignJava.isEmpty() || !forbidden.isEmpty()) {
                throw new GradleException(
                        "Sources JAR boundary mismatch: foreignJava=${foreignJava}, "
                                + "forbidden=${forbidden}"
                )
            }
        } finally {
            zip.close()
        }
    }
}

tasks.register('verifyPinnedArtifacts', Exec) {
    def logisticsNetworksJar = providers.gradleProperty('logisticsNetworksJar')
    doFirst {
        if (!logisticsNetworksJar.isPresent()) {
            throw new GradleException(
                    'Set -PlogisticsNetworksJar to the exact ATM 1.2.0 LogisticsNetworks artifact.'
            )
        }
    }
    commandLine 'python3', 'tools/verify_pinned_artifact.py',
            '--jar', logisticsNetworksJar.getOrElse('missing')
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyProductionJar')
    dependsOn tasks.named('verifySourcesJar')
    dependsOn tasks.named('verifyPinnedArtifacts')
}

publishing {
    publications {
        addon(MavenPublication) {
            from components.java
            artifactId = artifact_id
            pom {
                name = addon_name
                description = 'Exact-profile static BlueMap cages and top surfaces for LogisticsNetworks nodes.'
                url = 'https://github.com/jan-guenter/bluemap-logistics-networks-addon'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://spdx.org/licenses/MIT.html'
                        distribution = 'repo'
                    }
                }
                scm {
                    url = 'https://github.com/jan-guenter/bluemap-logistics-networks-addon'
                    connection = 'scm:git:https://github.com/jan-guenter/bluemap-logistics-networks-addon.git'
                }
            }
        }
    }
}
